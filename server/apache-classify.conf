# Apache auf dem hammerpi, nur im Heimnetz — wie moneyme.lan und cloud.lan.
# Einspielen mit tools/lan-einrichten.sh (einmalig, mit sudo).
<VirtualHost 192.168.180.84:443>
    ServerName classify.lan.hammerlore.de
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/classify.lan.hammerlore.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/classify.lan.hammerlore.de/privkey.pem
    SSLProtocol           -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder   off
    <Location />
        Require ip 192.168.0.0/16
    </Location>
    Header always set Strict-Transport-Security "max-age=31536000"
    # Uploads bis 25 MB, etwas Luft für den Rest der Anfrage
    LimitRequestBody 26214400
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPreserveHost On
    ProxyRequests     Off
    ProxyPass         / http://127.0.0.1:3018/
    ProxyPassReverse  / http://127.0.0.1:3018/
    ErrorDocument 503 "HammerClassify: Backend auf 127.0.0.1:3018 laeuft nicht (pm2 status hammerclassify)."
    ErrorLog  ${APACHE_LOG_DIR}/hammerclassify_error.log
    CustomLog ${APACHE_LOG_DIR}/hammerclassify_access.log combined
</VirtualHost>
